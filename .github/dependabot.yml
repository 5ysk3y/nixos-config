version: 2

updates:
  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows (+ a root action.yml); composite
    # actions need listing explicitly or their pins never get bumped.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
