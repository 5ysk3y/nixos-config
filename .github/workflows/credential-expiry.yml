name: Credential expiry check

# Expiring CI credentials fail quietly: an expired TS_AUTHKEY makes the
# full build skip, an expired update token stops the weekly flake.lock PR.
# Each secret below has a repository variable <NAME>_EXPIRES (DD-MM-YYYY),
# set whenever the secret is created or rotated; this opens an issue
# WARN_DAYS before any of them lapses.

on:
  schedule:
    - cron: "17 7 * * 1" # Mondays
  workflow_dispatch: {}

concurrency:
  group: credential-expiry
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  check:
    name: check credential expiry dates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      # Warn this many days ahead of an expiry date
      WARN_DAYS: 21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check expiry dates
        id: check
        env:
          TS_AUTHKEY_EXPIRES: ${{ vars.TS_AUTHKEY_EXPIRES }}
          GH_TOKEN_FOR_UPDATES_EXPIRES: ${{ vars.GH_TOKEN_FOR_UPDATES_EXPIRES }}
          GPG_PRIVATE_KEY_EXPIRES: ${{ vars.GPG_PRIVATE_KEY_EXPIRES }}
          TS_CI_ATTIC_PUSH_TOKEN_EXPIRES: ${{ vars.TS_CI_ATTIC_PUSH_TOKEN_EXPIRES }}
        run: |
          bash .github/scripts/check-credential-expiry.sh \
            TS_AUTHKEY \
            GH_TOKEN_FOR_UPDATES \
            GPG_PRIVATE_KEY \
            TS_CI_ATTIC_PUSH_TOKEN

      # One open issue at a time: updated while anything needs attention,
      # closed once everything is back outside the window.
      - name: Open, update or close the expiry issue
        env:
          GH_TOKEN: ${{ github.token }}
          ATTENTION: ${{ steps.check.outputs.attention }}
          REPORT_FILE: ${{ steps.check.outputs.report_file }}
        run: |
          set -euo pipefail
          title_prefix="chore(ci): credentials expiring"

          existing=$(gh issue list \
            --label "automated" \
            --state open \
            --json number,title \
            --jq '.[] | select(.title | startswith("chore(ci): credentials expiring")) | .number' \
            | head -n1)

          if [ "$ATTENTION" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "All tracked credentials are more than ${WARN_DAYS} days from expiry again."
              echo "Closed issue #${existing}"
            fi
            exit 0
          fi

          body_file="$(mktemp)"
          {
            printf '## Credential expiry check — %s\n\n' "$(date -u +%Y-%m-%d)"
            cat "$REPORT_FILE"
            printf '\n### What to do\n\n'
            printf -- '- Rotate each flagged secret (repo Settings → Secrets and variables → Actions → Secrets)\n'
            printf -- "- Set its \`<NAME>_EXPIRES\` variable to the new expiry date (same page, Variables tab)\n"
            printf -- "- \`TS_AUTHKEY\`: the new key must be pre-signed for Tailnet Lock and carry the CI tag\n"
            printf -- '- Re-run this workflow; the issue closes itself once nothing is flagged\n'
            printf '\n---\n*Generated by [credential-expiry workflow](https://github.com/%s/actions/workflows/credential-expiry.yml)*\n' "${{ github.repository }}"
          } > "$body_file"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$body_file"
            echo "Updated issue #${existing}"
          else
            gh issue create \
              --title "${title_prefix} ($(date -u +'%d/%m/%y'))" \
              --body-file "$body_file" \
              --label "automated"
          fi

      # A missing or malformed date means the check isn't really running for
      # that secret, so fail visibly rather than only noting it in the issue.
      - name: Fail on missing or invalid dates
        if: steps.check.outputs.invalid != '0'
        run: |
          echo "::error::${{ steps.check.outputs.invalid }} expiry variable(s) missing or invalid — see the step above"
          exit 1
