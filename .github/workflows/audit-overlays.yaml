name: Audit temporary overlays

on:
  pull_request:
    branches: [main]
    paths:
      - flake.lock
  workflow_dispatch: {}

concurrency:
  group: overlay-audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Check overlay obsolescence
    runs-on: ubuntu-latest
    permissions:
      issues: write
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1

      - name: FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@83282a8aef353db1d659d3bacf4a28b6683de0b3

      # Private flake inputs (nix-secrets): deploy key + github.com known_hosts
      - uses: ./.github/actions/private-flake-access
        with:
          ssh-private-key: ${{ secrets.CI_GITHUB_SSH_KEY }}

      - name: Run overlay audit
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
        run: bash .github/scripts/audit-overlays.sh

      - name: Open issue for obsolete or broken overlays
        if: steps.audit.outputs.obsolete_count != '0' || steps.audit.outputs.broken_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
        run: |
          set -euo pipefail
          REPORT_FILE="${{ steps.audit.outputs.report_file }}"
          ISSUE_BODY_FILE="$(mktemp)"
          {
            printf '## Overlay audit — %s\n\n' "$(date -u +'%Y-%m-%d')"

            if [ "${{ steps.audit.outputs.broken_count }}" != '0' ]; then
              printf '### ⚠️ Broken overrides — action needed now\n\n'
              printf 'These overlays fail to evaluate against the current locked nixpkgs. This is independent of whether their tracking issue/PR has resolved — the override itself needs fixing or removing immediately, or your next flake.lock bump will fail CI on this exact package.\n\n'
            fi

            printf 'The automated overlay audit detected **%s** overlay(s) that appear to be obsolete, and **%s** that are actively broken, based on current nixpkgs state.\n\n' \
              "${{ steps.audit.outputs.obsolete_count }}" "${{ steps.audit.outputs.broken_count }}"
            printf '### Results\n\n'
            cat "$REPORT_FILE"
            printf '\n### What to do\n\n'
            printf 'For each 🔴 **broken** entry above:\n\n'
            printf -- '- Update or remove the tracked entry in the relevant overlays/overlay-entries.nix so it evaluates against current nixpkgs (check the error text above — often an argument/attribute rename)\n'
            printf -- '- Run `nixos-rebuild build --flake .#gibson` and/or `darwin-rebuild build --flake .#macbook` locally to confirm clean build\n'
            printf -- '- Raise a PR linked to this issue and merge as soon as practical — this is blocking, not routine cleanup\n\n'
            printf 'For each ✅ **obsolete** entry above:\n\n'
            printf -- '- Remove the tracked entry (or its override) from the relevant overlays/overlay-entries.nix\n'
            printf -- '- Action any coupled removals described in the 📎 notes above\n'
            printf -- '- Run `nixos-rebuild build --flake .#gibson` and/or `darwin-rebuild build --flake .#macbook` locally to confirm clean build\n'
            printf -- '- Raise a PR linked to this issue and merge\n'
            printf -- '- Close this issue once all flagged overlays have been removed\n'
            printf '\n---\n*Generated by [audit-overlays workflow](https://github.com/%s/actions/workflows/audit-overlays.yaml)*\n' "${{ github.repository }}"
          } > "$ISSUE_BODY_FILE"

          existing=$(gh issue list \
            --label "automated" \
            --state open \
            --json number,title \
            --jq '.[] | select(.title | startswith("chore(overlays): audit")) | .number' \
            2>/dev/null | head -n1 || true)

          if [ -n "$existing" ]; then
            echo "Updating existing audit issue #${existing} ..."
            gh issue edit "$existing" \
              --body-file "$ISSUE_BODY_FILE"
            echo "Issue #${existing} updated"
            exit 0
          fi

          issue_url=$(gh issue create \
            --title "chore(overlays): audit flagged obsolete/broken overlays ($(date -u +'%d/%m/%y'))" \
            --body-file "$ISSUE_BODY_FILE" \
            2>&1) || { echo "::error::gh issue create failed: $issue_url"; exit 1; }
          issue_number="${issue_url##*/}"
          echo "Issue #${issue_number} created: ${issue_url}"

          if ! gh issue edit "$issue_number" --add-label "dependencies" --add-label "automated"; then
            echo "::error::failed to apply labels to issue #${issue_number} — created without labels, needs manual fix"
            exit 1
          fi
          echo "Labels applied to #${issue_number}"

      - name: No obsolete or broken overlays found
        if: steps.audit.outputs.obsolete_count == '0' && steps.audit.outputs.broken_count == '0'
        run: |
          echo "All audited overlays are still required and evaluate cleanly. No PR needed."
          cat "${{ steps.audit.outputs.report_file }}"
