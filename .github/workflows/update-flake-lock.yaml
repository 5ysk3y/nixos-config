name: Update flake.lock

on:
  workflow_dispatch: {}
  schedule:
    - cron: "51 1 * * 6"

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1

      - name: FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@83282a8aef353db1d659d3bacf4a28b6683de0b3

      # Private flake inputs (nix-secrets): deploy key + github.com known_hosts
      - uses: ./.github/actions/private-flake-access
        with:
          ssh-private-key: ${{ secrets.CI_GITHUB_SSH_KEY }}

      - name: Compute PR title 
        id: prtitle
        run: |
          echo "title=chore(flake): weekly update ($(date -u +'%d/%m/%y'))" >> "$GITHUB_OUTPUT"

      - name: Update flake.lock (create PR)
        id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}

          pr-title: ${{ steps.prtitle.outputs.title }}          
          pr-body: |
            Automated weekly `flake.lock` update.

            {{ env.GIT_COMMIT_MESSAGE }}
          pr-labels: |
            dependencies
            automated

          sign-commits: true
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Enable auto-merge for the PR that was just created/updated
      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          pull-request-number: ${{ steps.update.outputs.pull-request-number }}
          merge-method: squash
