name: Nix CI — Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  changes:
    name: detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      ci_relevant: ${{ steps.changed.outputs.ci_relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: changed
        name: Detect whether CI should run
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}")"

          elif [ "${{ github.event.forced }}" = "true" ]; then
            echo "Force push detected — marking CI as relevant"
            echo "ci_relevant=true" >> "$GITHUB_OUTPUT"
            exit 0

          else
            before="${{ github.event.before }}"
            after="${{ github.event.after }}"

            if git cat-file -e "${before}^{commit}" 2>/dev/null; then
              files="$(git diff --name-only "$before" "$after")"
            else
              echo "No valid base SHA — marking CI as relevant"
              echo "ci_relevant=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Changed files:"
          echo "$files"

          if echo "$files" | grep -Ev '^(README\.md|docs/|.*\.(md|png|jpe?g|svg))$' >/dev/null; then
            echo "ci_relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "ci_relevant=false" >> "$GITHUB_OUTPUT"
          fi

  fmt-check:
    name: formatting check
    needs: changes
    if: needs.changes.outputs.ci_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1
      - uses: DeterminateSystems/flakehub-cache-action@83282a8aef353db1d659d3bacf4a28b6683de0b3
      - name: Nix format check (nix fmt)
        run: |
          set -euo pipefail
          nix fmt --no-write-lock-file
          git diff --exit-code || {
            echo ""
            echo "Formatting required."
            echo "Run this locally to fix (or just commit again and let hooks handle it):"
            echo "  nix fmt"
            echo ""
            exit 1
          }

  lint-check:
    name: lint check
    needs: changes
    if: needs.changes.outputs.ci_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1
      - uses: DeterminateSystems/flakehub-cache-action@83282a8aef353db1d659d3bacf4a28b6683de0b3
      - name: statix
        run: |
          set -euo pipefail
          # --inputs-from .: use the flake.lock-pinned nixpkgs, same as the git hooks
          nix run --inputs-from . nixpkgs#statix -- check .
      - name: no ../ paths in Nix files
        run: bash .githooks/lib/no-parent-paths.sh

  gitleaks:
    name: gitleaks scan
    needs: changes
    if: needs.changes.outputs.ci_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1
      - uses: DeterminateSystems/flakehub-cache-action@83282a8aef353db1d659d3bacf4a28b6683de0b3
      - name: Run gitleaks (native)
        run: |
          set -euo pipefail
          nix run --inputs-from . nixpkgs#gitleaks -- git --redact --config .github/gitleaks.toml

  flake-secrets-check:
    name: full flake check (with secrets)
    needs: changes
    if: needs.changes.outputs.ci_relevant == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1
      - uses: DeterminateSystems/flakehub-cache-action@83282a8aef353db1d659d3bacf4a28b6683de0b3
      - uses: ./.github/actions/private-flake-access
        with:
          ssh-private-key: ${{ secrets.CI_GITHUB_SSH_KEY }}
      - name: Flake check
        run: |
          set -euo pipefail
          nix flake check --no-write-lock-file --all-systems
      # `nix flake check` skips darwinConfigurations ("known but unchecked"),
      # so without this the macbook config is only evaluated by the full
      # build, which runs only when nixpkgs itself changes.
      - name: Darwin eval check (macbook)
        run: |
          set -euo pipefail
          nix eval --raw --no-write-lock-file \
            .#darwinConfigurations.macbook.config.system.build.toplevel.drvPath
