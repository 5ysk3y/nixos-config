name: Nix CI — Full Build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      force_full_build:
        description: 'Force full build regardless of flake.lock changes'
        type: boolean
        default: false

concurrency:
  group: full-build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  changes:
    name: detect lockfile changes
    runs-on: ubuntu-latest
    outputs:
      lockfile_changed: ${{ steps.changed.outputs.lockfile_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_full_build }}" = "true" ]; then
              echo "lockfile_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "lockfile_changed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          base_hash="$(git show "${{ github.event.pull_request.base.sha }}:flake.lock" 2>/dev/null | jq -r '.nodes.nixpkgs.locked.narHash // empty')" || base_hash=""
          head_hash="$(git show "${{ github.event.pull_request.head.sha }}:flake.lock" 2>/dev/null | jq -r '.nodes.nixpkgs.locked.narHash // empty')" || head_hash=""

          echo "base nixpkgs narHash: ${base_hash:-<none>}"
          echo "head nixpkgs narHash: ${head_hash:-<none>}"

          if [ -z "$base_hash" ] || [ -z "$head_hash" ]; then
            echo "::warning::couldn't read nodes.nixpkgs.locked.narHash from flake.lock on one side — running full build to be safe"
            echo "lockfile_changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$base_hash" != "$head_hash" ]; then
            echo "lockfile_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "lockfile_changed=false" >> "$GITHUB_OUTPUT"
          fi

  check-cache:
    name: verify attic cache is reachable
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.lockfile_changed == 'true'
    steps:
      # Tailnet Lock is enabled, so this must be a pre-signed, ephemeral,
      # reusable auth key: OAuth clients / OIDC federation can't join a
      # locked tailnet (tailscale/github-action README, "Tailnet Lock").
      # The runner's "authkey has been deprecated" warning is expected here.
      - name: Setup tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # Required with Tailnet Lock: somewhere to keep the Tailnet Key
          # Authority state (the default is in-memory)
          statedir: ${{ runner.temp }}/tailscale-state
          # Wait until attic is actually reachable (new peers propagate
          # eventually) before anything tries the cache.
          ping: attic.taileda465.ts.net
      - name: Verify attic cache is reachable
        run: |
          curl --fail --silent --show-error --max-time 30 \
            http://attic.taileda465.ts.net:8080/home-cache/nix-cache-info

  eval-check:
    name: full build check (linux)
    needs:
      - changes
      - check-cache
    if: |
      needs.changes.result == 'success' &&
      needs.check-cache.result == 'success' &&
      needs.changes.outputs.lockfile_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Free up disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android
          df -h
      # Tailnet Lock is enabled, so this must be a pre-signed, ephemeral,
      # reusable auth key: OAuth clients / OIDC federation can't join a
      # locked tailnet (tailscale/github-action README, "Tailnet Lock").
      # The runner's "authkey has been deprecated" warning is expected here.
      - name: Setup tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # Required with Tailnet Lock: somewhere to keep the Tailnet Key
          # Authority state (the default is in-memory)
          statedir: ${{ runner.temp }}/tailscale-state
          # Wait until attic is actually reachable (new peers propagate
          # eventually) before anything tries the cache.
          ping: attic.taileda465.ts.net
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1
        with:
          extra-conf: |
            extra-substituters = http://attic.taileda465.ts.net:8080/home-cache
            extra-trusted-public-keys = home-cache:E1OhBtGAhOkDjZortT+YYKTyNZ5/gPCcaQ/ryGKUPdU=
      - uses: DeterminateSystems/flakehub-cache-action@83282a8aef353db1d659d3bacf4a28b6683de0b3
        with:
          use-gha-cache: disabled
      - uses: ./.github/actions/private-flake-access
        with:
          ssh-private-key: ${{ secrets.CI_GITHUB_SSH_KEY }}
      - name: Full build test
        run: |
          set -euo pipefail
          nix build .#nixosConfigurations.gibson.config.system.build.toplevel --no-write-lock-file
      - name: Push built closure to attic
        continue-on-error: true
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 60
          max_attempts: 2
          command: |
            set -euo pipefail
            nix run --inputs-from . nixpkgs#attic-client -- login home http://attic.taileda465.ts.net:8080 "${{ secrets.TS_CI_ATTIC_PUSH_TOKEN }}"
            nix run --inputs-from . nixpkgs#attic-client -- push home:home-cache --ignore-upstream-cache-filter -j 1 ./result

  darwin-eval-check:
    name: full build check (darwin)
    needs:
      - changes
      - check-cache
    if: |
      needs.changes.result == 'success' &&
      needs.check-cache.result == 'success' &&
      needs.changes.outputs.lockfile_changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Free up disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android
          df -h
      # Tailnet Lock is enabled, so this must be a pre-signed, ephemeral,
      # reusable auth key: OAuth clients / OIDC federation can't join a
      # locked tailnet (tailscale/github-action README, "Tailnet Lock").
      # The runner's "authkey has been deprecated" warning is expected here.
      - name: Setup tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # Required with Tailnet Lock: somewhere to keep the Tailnet Key
          # Authority state (the default is in-memory)
          statedir: ${{ runner.temp }}/tailscale-state
          # Wait until attic is actually reachable (new peers propagate
          # eventually) before anything tries the cache.
          ping: attic.taileda465.ts.net
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1
        with:
          extra-conf: |
            extra-substituters = http://attic.taileda465.ts.net:8080/home-cache
            extra-trusted-public-keys = home-cache:E1OhBtGAhOkDjZortT+YYKTyNZ5/gPCcaQ/ryGKUPdU=
      - uses: DeterminateSystems/flakehub-cache-action@83282a8aef353db1d659d3bacf4a28b6683de0b3
        with:
          use-gha-cache: disabled
      - uses: ./.github/actions/private-flake-access
        with:
          ssh-private-key: ${{ secrets.CI_GITHUB_SSH_KEY }}
      - name: Full build test
        run: |
          set -euo pipefail
          nix build .#darwinConfigurations.macbook.config.system.build.toplevel --no-write-lock-file
      - name: Push built closure to attic
        continue-on-error: true
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 60
          max_attempts: 2
          command: |
            set -euo pipefail
            nix run --inputs-from . nixpkgs#attic-client -- login home http://attic.taileda465.ts.net:8080 "${{ secrets.TS_CI_ATTIC_PUSH_TOKEN }}"
            nix run --inputs-from . nixpkgs#attic-client -- push home:home-cache --ignore-upstream-cache-filter -j 1 ./result

  ci-gate:
    name: CI required status
    if: always()
    needs:
      - changes
      - check-cache
      - eval-check
      - darwin-eval-check
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs actually succeeded
        run: |
          set -euo pipefail
          echo "changes:           ${{ needs.changes.result }}"
          echo "check-cache:       ${{ needs.check-cache.result }}"
          echo "eval-check:        ${{ needs.eval-check.result }}"
          echo "darwin-eval-check: ${{ needs.darwin-eval-check.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes job did not succeed"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.lockfile_changed }}" = "true" ]; then
            for r in "${{ needs.check-cache.result }}" "${{ needs.eval-check.result }}" "${{ needs.darwin-eval-check.result }}"; do
              if [ "$r" != "success" ]; then
                echo "::error::a required full-build job did not succeed (got: $r)"
                exit 1
              fi
            done
          fi

          echo "All required checks passed."
