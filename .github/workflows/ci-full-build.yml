name: Nix CI — Full Build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      force_full_build:
        description: 'Force full build regardless of flake.lock changes'
        type: boolean
        default: false

concurrency:
  group: full-build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: detect lockfile changes
    runs-on: ubuntu-latest
    outputs:
      lockfile_changed: ${{ steps.changed.outputs.lockfile_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_full_build }}" = "true" ]; then
              echo "lockfile_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "lockfile_changed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          files="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"
          echo "Changed files:"
          echo "$files"
          if echo "$files" | grep -qx 'flake.lock'; then
            echo "lockfile_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "lockfile_changed=false" >> "$GITHUB_OUTPUT"
          fi

  check-cache:
    name: verify attic cache is reachable
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.lockfile_changed == 'true'
    steps:
      - name: Setup tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Verify attic cache is reachable
        run: |
          curl --fail --silent --show-error --max-time 30 \
            http://attic.taileda465.ts.net:8080/home-cache/nix-cache-info

  eval-check:
    name: full build check (linux)
    needs:
      - changes
      - check-cache
    if: |
      needs.changes.result == 'success' &&
      needs.check-cache.result == 'success' &&
      needs.changes.outputs.lockfile_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Free up disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android
          df -h
      - name: Setup tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858
        with:
          extra-conf: |
            extra-substituters = http://attic.taileda465.ts.net:8080/home-cache
            extra-trusted-public-keys = home-cache:E1OhBtGAhOkDjZortT+YYKTyNZ5/gPCcaQ/ryGKUPdU=
      - uses: DeterminateSystems/flakehub-cache-action@e62e272c914d4ad8e4d1587a864e9c3ad2cba9de
        with:
          github-actions-cache: disabled
      - name: Start ssh-agent and add deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.CI_GITHUB_SSH_KEY }}
      - name: Add GitHub to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts
      - name: Prepare age key in runner temp
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/age"
          printf "%s" "${{ secrets.SOPS_AGE_KEY }}" > "$RUNNER_TEMP/age/keys.txt"
          chmod 0600 "$RUNNER_TEMP/age/keys.txt"
          echo "SOPS_AGE_KEY_FILE=$RUNNER_TEMP/age/keys.txt" >> "$GITHUB_ENV"
      - name: Full build test
        run: |
          set -euo pipefail
          nix build .#nixosConfigurations.gibson.config.system.build.toplevel --no-write-lock-file
      - name: Push built closure to attic
        continue-on-error: true
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 60
          max_attempts: 2
          command: |
            set -euo pipefail
            nix run nixpkgs#attic-client -- login home http://attic.taileda465.ts.net:8080 "${{ secrets.TS_CI_ATTIC_PUSH_TOKEN }}"
            nix run nixpkgs#attic-client -- push home:home-cache --ignore-upstream-cache-filter -j 2 ./result

  darwin-eval-check:
    name: full build check (darwin)
    needs:
      - changes
      - check-cache
    if: |
      needs.changes.result == 'success' &&
      needs.check-cache.result == 'success' &&
      needs.changes.outputs.lockfile_changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Free up disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android
          df -h
      - name: Setup tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858
        with:
          extra-conf: |
            extra-substituters = http://attic.taileda465.ts.net:8080/home-cache
            extra-trusted-public-keys = home-cache:E1OhBtGAhOkDjZortT+YYKTyNZ5/gPCcaQ/ryGKUPdU=
      - uses: DeterminateSystems/flakehub-cache-action@e62e272c914d4ad8e4d1587a864e9c3ad2cba9de
        with:
          github-actions-cache: disabled
      - name: Start ssh-agent and add deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.CI_GITHUB_SSH_KEY }}
      - name: Add GitHub to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts
      - name: Prepare age key in runner temp
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/age"
          printf "%s" "${{ secrets.SOPS_AGE_KEY }}" > "$RUNNER_TEMP/age/keys.txt"
          chmod 0600 "$RUNNER_TEMP/age/keys.txt"
          echo "SOPS_AGE_KEY_FILE=$RUNNER_TEMP/age/keys.txt" >> "$GITHUB_ENV"
      - name: Full build test
        run: |
          set -euo pipefail
          nix build .#darwinConfigurations.macbook.config.system.build.toplevel --no-write-lock-file
      - name: Push built closure to attic
        continue-on-error: true
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 60
          max_attempts: 2
          command: |
            set -euo pipefail
            nix run nixpkgs#attic-client -- login home http://attic.taileda465.ts.net:8080 "${{ secrets.TS_CI_ATTIC_PUSH_TOKEN }}"
            nix run nixpkgs#attic-client -- push home:home-cache --ignore-upstream-cache-filter -j 2 ./result

  ci-gate:
    name: CI required status
    if: always()
    needs:
      - changes
      - check-cache
      - eval-check
      - darwin-eval-check
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs actually succeeded
        run: |
          set -euo pipefail
          echo "changes:           ${{ needs.changes.result }}"
          echo "check-cache:       ${{ needs.check-cache.result }}"
          echo "eval-check:        ${{ needs.eval-check.result }}"
          echo "darwin-eval-check: ${{ needs.darwin-eval-check.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes job did not succeed"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.lockfile_changed }}" = "true" ]; then
            for r in "${{ needs.check-cache.result }}" "${{ needs.eval-check.result }}" "${{ needs.darwin-eval-check.result }}"; do
              if [ "$r" != "success" ]; then
                echo "::error::a required full-build job did not succeed (got: $r)"
                exit 1
              fi
            done
          fi

          echo "All required checks passed."
