name: Nix CI — Full Build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      force_full_build:
        description: 'Force full build regardless of changed files'
        type: boolean
        default: false

concurrency:
  group: full-build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  # attic's MagicDNS name: CI reaches the cache API over the tailnet
  ATTIC_HOST: attic.taileda465.ts.net

jobs:
  changes:
    name: detect lockfile changes
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.changed.outputs.build_needed }}
      # The weekly flake.lock PR, opened by update-flake-lock.yaml from
      # DeterminateSystems/update-flake-lock's default branch. Only this PR
      # gets the package-changes comment.
      weekly_update: ${{ github.event_name == 'pull_request' && github.head_ref == 'update_flake_lock_action' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_full_build }}" = "true" ]; then
              echo "build_needed=true" >> "$GITHUB_OUTPUT"
            else
              echo "build_needed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Compare against where the PR branched from main, not main's
          # current tip: otherwise a branch opened before the weekly lock
          # update looks like it changes the lock and gets a needless build.
          fork_point="$(git merge-base \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"

          # `nix flake check` only evaluates, so build whenever a PR changes
          # what gets compiled rather than just how it's configured: any
          # flake input (not only nixpkgs), the local packages, the overlays,
          # any patch, and the waybar scripts' own packages.
          changed="$(git diff --name-only "$fork_point" "${{ github.event.pull_request.head.sha }}")"
          echo "changed files:"
          while IFS= read -r f; do echo "  $f"; done <<<"$changed"
          if grep -qE '^flake\.lock$|^pkgs/|overlay|\.patch$|/_scripts/' <<<"$changed"; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          fi

  check-cache:
    name: verify attic cache is reachable
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.build_needed == 'true'
    steps:
      # Local actions are read from the checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Join the tailnet
        uses: ./.github/actions/tailnet
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.ATTIC_HOST }}
      - name: Verify attic cache is reachable
        run: |
          curl --fail --silent --show-error --max-time 30 \
            http://${{ env.ATTIC_HOST }}:8080/home-cache/nix-cache-info

  eval-check:
    name: full build check (linux)
    needs:
      - changes
      - check-cache
    if: |
      needs.changes.result == 'success' &&
      needs.check-cache.result == 'success' &&
      needs.changes.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Free up disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android
          df -h
      - name: Join the tailnet
        uses: ./.github/actions/tailnet
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.ATTIC_HOST }}
      - uses: ./.github/actions/nix-setup
        with:
          attic-host: ${{ env.ATTIC_HOST }}
          extra-nix-config: max-silent-time = 2700
      - uses: ./.github/actions/private-flake-access
        with:
          ssh-private-key: ${{ secrets.CI_GITHUB_SSH_KEY }}
      # One attempt: Nix keeps no record of failed builds, so a retry
      # rebuilds a broken derivation from scratch and doubles the wait for
      # a red result. Weekly-update builds here: mean 31 min, longest 75.
      - name: Full build test
        timeout-minutes: 120
        run: nix build .#nixosConfigurations.gibson.config.system.build.toplevel --no-write-lock-file -L
      # Only what CI built: attic skips paths signed by the cache's upstream
      # (cache.nixos.org), which machines fetch from there. Those were
      # 75-88% of push time over the tailnet, and both failed uploads seen.
      # -j 1 keeps the load on attic down; a retried attempt skips paths
      # already pushed.
      - name: Push built closure to attic
        continue-on-error: true
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        # Passed via env rather than interpolated into the command, which the
        # retry action logs in full at debug level.
        env:
          ATTIC_TOKEN: ${{ secrets.TS_CI_ATTIC_PUSH_TOKEN }}
        with:
          timeout_minutes: 40
          max_attempts: 2
          command: |
            set -euo pipefail
            nix run --inputs-from . nixpkgs#attic-client -- login home http://${{ env.ATTIC_HOST }}:8080 "$ATTIC_TOKEN"
            nix run --inputs-from . nixpkgs#attic-client -- push home:home-cache -j 1 ./result
      # Informational only: a failure here never fails the job or the gate.
      - name: Package changes against the base branch
        if: needs.changes.outputs.weekly_update == 'true'
        continue-on-error: true
        timeout-minutes: 60
        uses: ./.github/actions/nvd-diff
        with:
          host: gibson
          label: hosts/personal/gibson
          attr: nixosConfigurations.gibson.config.system.build.toplevel

  darwin-eval-check:
    name: full build check (darwin)
    needs:
      - changes
      - check-cache
    if: |
      needs.changes.result == 'success' &&
      needs.check-cache.result == 'success' &&
      needs.changes.outputs.build_needed == 'true'
    runs-on: macos-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Join the tailnet
        uses: ./.github/actions/tailnet
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ env.ATTIC_HOST }}
      - uses: ./.github/actions/nix-setup
        with:
          attic-host: ${{ env.ATTIC_HOST }}
          extra-nix-config: max-silent-time = 2700
      - uses: ./.github/actions/private-flake-access
        with:
          ssh-private-key: ${{ secrets.CI_GITHUB_SSH_KEY }}
      # One attempt: Nix keeps no record of failed builds, so a retry
      # rebuilds a broken derivation from scratch and doubles the wait for
      # a red result. Weekly-update builds here: mean 5 min, longest 9.
      - name: Full build test
        timeout-minutes: 60
        run: nix build .#darwinConfigurations.macbook.config.system.build.toplevel --no-write-lock-file -L
      # Only what CI built: attic skips paths signed by the cache's upstream
      # (cache.nixos.org), which machines fetch from there. Those were
      # 75-88% of push time over the tailnet, and both failed uploads seen.
      # -j 1 keeps the load on attic down; a retried attempt skips paths
      # already pushed.
      - name: Push built closure to attic
        continue-on-error: true
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        # Passed via env rather than interpolated into the command, which the
        # retry action logs in full at debug level.
        env:
          ATTIC_TOKEN: ${{ secrets.TS_CI_ATTIC_PUSH_TOKEN }}
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: |
            set -euo pipefail
            nix run --inputs-from . nixpkgs#attic-client -- login home http://${{ env.ATTIC_HOST }}:8080 "$ATTIC_TOKEN"
            nix run --inputs-from . nixpkgs#attic-client -- push home:home-cache -j 1 ./result
      # Informational only: a failure here never fails the job or the gate.
      - name: Package changes against the base branch
        if: needs.changes.outputs.weekly_update == 'true'
        continue-on-error: true
        timeout-minutes: 60
        uses: ./.github/actions/nvd-diff
        with:
          host: macbook
          label: hosts/personal/macbook
          attr: darwinConfigurations.macbook.config.system.build.toplevel

  # Posts the two hosts' package changes as one comment on the weekly
  # flake.lock PR, updated in place on later pushes. Not a dependency of
  # ci-gate, so it can't block a merge.
  nvd-comment:
    name: post package changes
    needs:
      - changes
      - eval-check
      - darwin-eval-check
    if: |
      always() &&
      needs.changes.outputs.weekly_update == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Matches nothing when both diff steps failed; the script then exits
      # without posting.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: nvd-*
          merge-multiple: true
          path: nvd
      - name: Post or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HOSTS: gibson macbook
        run: bash .github/scripts/post-nvd-comment.sh nvd

  ci-gate:
    name: CI required status
    if: always()
    needs:
      - changes
      - check-cache
      - eval-check
      - darwin-eval-check
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs actually succeeded
        run: |
          set -euo pipefail
          echo "changes:           ${{ needs.changes.result }}"
          echo "check-cache:       ${{ needs.check-cache.result }}"
          echo "eval-check:        ${{ needs.eval-check.result }}"
          echo "darwin-eval-check: ${{ needs.darwin-eval-check.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes job did not succeed"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.build_needed }}" = "true" ]; then
            for r in "${{ needs.check-cache.result }}" "${{ needs.eval-check.result }}" "${{ needs.darwin-eval-check.result }}"; do
              if [ "$r" != "success" ]; then
                echo "::error::a required full-build job did not succeed (got: $r)"
                exit 1
              fi
            done
          fi

          echo "All required checks passed."
