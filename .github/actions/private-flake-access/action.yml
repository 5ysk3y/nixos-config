name: Private flake input access
description: >
  Load the read-only deploy key into ssh-agent and trust github.com's host
  keys, so git+ssh flake inputs (nix-secrets) can be fetched by Nix.

inputs:
  ssh-private-key:
    description: Read-only deploy key with access to the private flake inputs.
    required: true

runs:
  using: composite
  steps:
    - name: Start ssh-agent and add deploy key
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Add GitHub to known_hosts
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
        # Refuse unknown/changed host keys rather than falling back to TOFU
        echo "GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"
