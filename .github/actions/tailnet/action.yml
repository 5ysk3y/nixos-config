name: Join the tailnet
description: >
  Join the tailnet as an ephemeral CI node and wait until a host is
  reachable. If that fails, print Tailscale's own view of the node and of
  Tailnet Lock to show why.

inputs:
  authkey:
    description: >
      Pre-signed, tagged, reusable, ephemeral auth key. Tailnet Lock is
      enabled, so OAuth clients / OIDC federation can't be used instead
      (tailscale/github-action README, "Tailnet Lock"); the runner's
      "authkey has been deprecated" warning is expected.
    required: true
  ping:
    description: Host (MagicDNS name or Tailscale IP) to wait for before continuing.
    required: true

runs:
  using: composite
  steps:
    # Tailnet Lock needs somewhere to keep the Tailnet Key Authority state
    # (the action's default is in-memory). Composite actions get the runner's
    # environment variables, so the path comes from $RUNNER_TEMP.
    - name: Pick tailscale state directory
      id: state
      shell: bash
      run: echo "dir=${RUNNER_TEMP}/tailscale-state" >> "$GITHUB_OUTPUT"

    - name: Setup tailscale
      uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf
      with:
        authkey: ${{ inputs.authkey }}
        statedir: ${{ steps.state.outputs.dir }}
        # Wait until the host is actually reachable (new peers propagate
        # eventually) before anything tries to use it.
        ping: ${{ inputs.ping }}

    # tailscale/github-action points macOS's system DNS at 100.100.100.100,
    # which fails for public names (tailscale/github-action#315). Send only
    # tailnet names there and give everything else back to the runner's DNS.
    - name: Use split DNS on macOS
      if: runner.os == 'macOS'
      shell: bash
      env:
        PING_HOST: ${{ inputs.ping }}
      run: |
        set -euo pipefail
        suffix=$(sudo tailscale status --json | jq -r .CurrentTailnet.MagicDNSSuffix)
        sudo mkdir -p /etc/resolver
        echo "nameserver 100.100.100.100" | sudo tee "/etc/resolver/$suffix" >/dev/null
        sudo networksetup -setdnsservers Ethernet Empty
        sudo networksetup -setsearchdomains Ethernet Empty
        sudo dscacheutil -flushcache
        sudo killall -HUP mDNSResponder
        dscacheutil -q host -a name launch.actions.githubusercontent.com | grep -q address
        dscacheutil -q host -a name "$PING_HOST" | grep -q address

    # A peer missing from the netmap (e.g. an auth key without the right tag)
    # surfaces as a DNS lookup failure in the ping above; these show the
    # actual state. Only node and peer names/addresses visible to this CI node
    # are printed, and the run logs of a public repo are public.
    - name: Tailscale diagnostics
      if: failure()
      shell: bash
      run: |
        if ! command -v tailscale >/dev/null 2>&1; then
          echo "tailscale was never installed — the failure is before 'tailscale up'"
          exit 0
        fi
        echo "::group::tailscale status"
        tailscale status || true
        echo "::endgroup::"
        echo "::group::tailscale lock status"
        tailscale lock status || true
        echo "::endgroup::"
